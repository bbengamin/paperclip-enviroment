services:
  ubuntu-ssh:
    image: ${DOCKER_IMAGE:-bbengamin/paperclip-enviroment}:${DOCKER_TAG:-latest}
    build:
      context: .
    container_name: ubuntu-ssh
    ports:
      - "${HOST_BIND_IP}:2222:22"
      - "${HOST_BIND_IP}:${PAPERCLIP_PREVIEW_GATEWAY_HOST_PORT:-3999}:3999"
    environment:
      CODEX_HOME: /home/${SSH_USER:-guest}/.codex
      SSH_USER: ${SSH_USER:-guest}
      SSH_UID: ${SSH_UID:-1000}
      SSH_GID: ${SSH_GID:-1000}
      AUTHORIZED_KEYS_FILE: /run/authorized_keys
      WORKSPACE_DIR: /workspace
      ANTHROPIC_BASE_URL:
      ANTHROPIC_AUTH_TOKEN:
      PAPERCLIP_PREVIEW_GATEWAY_ENABLED: ${PAPERCLIP_PREVIEW_GATEWAY_ENABLED:-1}
      PAPERCLIP_PREVIEW_GATEWAY_PORT: 3999
      PAPERCLIP_PREVIEW_ENVIRONMENT_ID: ${PAPERCLIP_PREVIEW_ENVIRONMENT_ID:-}
      PAPERCLIP_PREVIEW_ENVIRONMENT_TYPE: ${PAPERCLIP_PREVIEW_ENVIRONMENT_TYPE:-ssh}
      # Operator-facing origin the preview gateway is reachable at. The gateway
      # inside the container cannot see the host's Tailscale interface, so we
      # derive it from the already-configured private bind IP + published port.
      # Override in .env if the gateway sits behind a different host/name.
      PAPERCLIP_PREVIEW_BASE_URL: ${PAPERCLIP_PREVIEW_BASE_URL:-http://${HOST_BIND_IP}:${PAPERCLIP_PREVIEW_GATEWAY_HOST_PORT:-3999}}
      PAPERCLIP_PREVIEW_SIGNING_SECRET_FILE: ${PAPERCLIP_PREVIEW_SIGNING_SECRET_FILE:-/run/paperclip-preview/signing-secret}
      PREVIEW_SIGNING_SECRET: ${PREVIEW_SIGNING_SECRET:-}
      PAPERCLIP_PREVIEW_ALLOWED_PORTS: ${PAPERCLIP_PREVIEW_ALLOWED_PORTS:-3000,3001,4000,4200,5000,5173,5174,8000,8080,9000}
      # Docker-in-Docker: the environment runs its own rootless dockerd and
      # exposes it on a per-user socket. DOCKER_RUNTIME=off disables startup.
      DOCKER_RUNTIME: ${DOCKER_RUNTIME:-rootless}
    volumes:
      - ${AUTHORIZED_KEYS_SOURCE}:/run/authorized_keys:ro
      # /workspace is Paperclip's remote runtime root. Keep it separate from
      # this environment repo so agent runs never inherit the wrong git context.
      - paperclip-workspace:/workspace
      - .:/environment:ro
      - hostkeys:/hostkeys
      # Rootless Docker stores its images/containers under the SSH user's home
      # (~/.local/share/docker), so the persisted home volume keeps them across
      # container recreation. No host Docker socket is mounted.
      - guest-home:/home/${SSH_USER:-guest}
    security_opt:
      # Rootless dockerd creates nested user/network namespaces; the default
      # seccomp/AppArmor profiles block the syscalls it needs (unshare, mount).
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      # Rootless dockerd needs to create nested UID/GID maps and mount
      # namespaces inside the outer environment container. NET_ADMIN plus
      # /dev/net/tun lets rootlesskit create its slirp4netns TAP device.
      - SYS_ADMIN
      - SETUID
      - SETGID
      - NET_ADMIN
    devices:
      - /dev/net/tun
    # Required on Docker Desktop for nested containers to start successfully
    # under the rootless daemon. Without this, dockerd may listen, but inner
    # `docker run` can fail mounting /proc during runc setup.
    privileged: true
    restart: unless-stopped

volumes:
  guest-home:
  hostkeys:
  paperclip-workspace:
