services:
  ubuntu-ssh:
    image: ${DOCKER_IMAGE:-bbengamin/paperclip-enviroment}:${DOCKER_TAG:-latest}
    build:
      context: .
    container_name: ubuntu-ssh
    ports:
      - "${HOST_BIND_IP}:2222:22"
    environment:
      CODEX_HOME: /home/${SSH_USER:-guest}/.codex
      SSH_USER: ${SSH_USER:-guest}
      SSH_UID: ${SSH_UID:-1000}
      SSH_GID: ${SSH_GID:-1000}
      AUTHORIZED_KEYS_FILE: /run/authorized_keys
      # Docker-in-Docker: the environment runs its own rootless dockerd and
      # exposes it on a per-user socket. DOCKER_RUNTIME=off disables startup.
      DOCKER_RUNTIME: ${DOCKER_RUNTIME:-rootless}
    volumes:
      - ${AUTHORIZED_KEYS_SOURCE}:/run/authorized_keys:ro
      - .:/workspace:rw
      - hostkeys:/hostkeys
      # Rootless Docker stores its images/containers under the SSH user's home
      # (~/.local/share/docker), so the persisted home volume keeps them across
      # container recreation. No host Docker socket is mounted.
      - guest-home:/home/${SSH_USER:-guest}
    security_opt:
      # Rootless dockerd creates nested user/network namespaces; the default
      # seccomp/AppArmor profiles block the syscalls it needs (unshare, mount).
      - seccomp:unconfined
      - apparmor:unconfined
    # If rootless dockerd fails to start on your host, try these fallbacks in
    # order of preference (see README "Docker access"):
    #   1. add the /dev/fuse device so fuse-overlayfs can be used as storage
    #   2. run the host with the sysbox runtime (`runtime: sysbox-runc`)
    #   3. last resort: set `privileged: true`
    # devices:
    #   - /dev/fuse
    # privileged: true
    restart: unless-stopped

volumes:
  guest-home:
  hostkeys:
