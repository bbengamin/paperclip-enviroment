name: Validate Cloudflare Bridge

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the Cloudflare bridge after validation
        required: true
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync Docker tooling context
        run: npm run sync:tooling

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

